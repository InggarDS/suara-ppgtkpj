# Production stack for a single VPS.
#
#   app    – Next.js standalone server (image built by CI, pulled from GHCR)
#   redis  – ephemeral cache for the participant-state snapshot (Phase 2)
#   caddy  – TLS termination + reverse proxy, unbuffered for SSE
#
# Postgres and PgBouncer stay on the HOST (already installed and tuned):
#   app -> host.docker.internal:6432 (PgBouncer, pooled)  -> localhost:5432 (Postgres)
#
# Resource caps below are sized for a 1 GB VPS sharing the box with host
# Postgres. On a 2 GB+ box, raise app mem_limit to 1g / NODE_OPTIONS to 768,
# and redis --maxmemory to 256mb.
#
# Copy deploy/env.example to .env on the VPS and fill it in before `up`.

services:
  app:
    image: ${IMAGE:-ghcr.io/inggards/suara-ppgtkpj}:${TAG:-latest}
    restart: always
    env_file: [.env]
    environment:
      REDIS_URL: "redis://redis:6379"
      NODE_OPTIONS: "--max-old-space-size=320"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    expose:
      - "3000"
    # No hard mem_limit: on a 1 GB host without swap-accounting cgroups a cap
    # means OOM-kill with no swap cushion. NODE_OPTIONS caps the JS heap; the
    # host's 2 GB swap is the real safety net. redis/caddy stay capped since
    # they never grow. If you enable swapaccount=1 in GRUB, add back:
    #   mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - "96mb"
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - "6379"
    mem_limit: 128m

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    mem_limit: 64m

volumes:
  caddy_data:
  caddy_config:
