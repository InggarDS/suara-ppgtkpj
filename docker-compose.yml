# Production stack for a single VPS.
#
#   app       – Next.js standalone server (image built by CI, pulled from GHCR)
#   pgbouncer – transaction-mode connection pooler in front of Postgres
#   db        – PostgreSQL 16 (data in the `pgdata` named volume)
#   redis     – ephemeral cache for the participant-state snapshot (Phase 2)
#   caddy     – TLS termination + reverse proxy, unbuffered for SSE
#
#   app -> pgbouncer:6432 (pooled)  -> db:5432 (Postgres)
#   app -> db:5432 directly, for `prisma db push` only (DIRECT_DATABASE_URL)
#
# Resource caps below are sized for a 1 GB VPS. On a 2 GB+ box, raise app
# NODE_OPTIONS to 768, redis --maxmemory to 256mb, db mem_limit to 512m, and
# pgbouncer DEFAULT_POOL_SIZE to 40.
#
# Copy deploy/env.example to .env on the VPS and fill it in before `up`.

services:
  app:
    image: ${IMAGE:-ghcr.io/inggards/suara-ppgtkpj}:${TAG:-latest}
    restart: always
    env_file: [.env]
    environment:
      REDIS_URL: "redis://redis:6379"
      NODE_OPTIONS: "--max-old-space-size=320"
    depends_on:
      redis:
        condition: service_started
      pgbouncer:
        condition: service_started
    expose:
      - "3000"
    # No hard mem_limit: on a 1 GB host without swap-accounting cgroups a cap
    # means OOM-kill with no swap cushion. NODE_OPTIONS caps the JS heap; the
    # host's 2 GB swap is the real safety net. redis/caddy stay capped since
    # they never grow. If you enable swapaccount=1 in GRUB, add back:
    #   mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  db:
    image: postgres:16-bookworm
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-suara}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suara} -d ${POSTGRES_DB:-suara}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-suara}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_NAME: ${POSTGRES_DB:-suara}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: "6432"
      MAX_CLIENT_CONN: "300"
      DEFAULT_POOL_SIZE: "15"
      RESERVE_POOL_SIZE: "5"
      ADMIN_USERS: ${POSTGRES_USER:-suara}
    expose:
      - "6432"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 32m

  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - "96mb"
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - "6379"
    mem_limit: 128m

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    mem_limit: 64m

volumes:
  caddy_data:
  caddy_config:
  pgdata:
